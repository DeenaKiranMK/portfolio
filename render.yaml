services:
  - type: web
    name: deenakiranmk-portfolio
    runtime: static
    buildCommand: "true"
    staticPublishPath: .
    autoDeployTrigger: commit
    renderSubdomainPolicy: enabled
    headers:
      - path: /*
        name: X-Frame-Options
        value: sameorigin
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
